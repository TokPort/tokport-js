name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test packages
      - run: bun run build
      - run: cd packages/client && bun run type-check
      - run: cd packages/ai-sdk-provider && bun run type-check
